<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrogCore</title>
<style>
  :root { --bg:#1b1f1c; --fg:#e8e6df; --muted:#9aa39b; --line:#364038; --accent:#c9d86b; --err:#ff8a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:44rem; margin:0 auto; padding:2rem 1rem; }
  h1 { font-size:1.6rem; margin:0 0 1.5rem; }
  input, button { font:inherit; padding:.5rem .75rem; border:1px solid var(--line); background:#232823; color:var(--fg); border-radius:4px; }
  input { width:100%; margin-bottom:.6rem; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#1b1f1c; border-color:var(--accent); font-weight:600; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:.6rem .4rem; border-bottom:1px solid var(--line); vertical-align:middle; }
  .muted { color:var(--muted); } .err { color:var(--err); min-height:1.5em; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  header h1 { margin:0; }
  .row { display:flex; gap:.6rem; } .row button { flex:1; }
</style>
<main>
  <section id="auth">
    <h1>FrogCore</h1>
    <p class="muted">Use the same username and password on your Cyclops to upload surveys.</p>
    <input id="u" placeholder="Username" autocomplete="username">
    <input id="p" type="password" placeholder="Password (at least 10 characters)" autocomplete="current-password">
    <div class="row"><button id="login" class="primary">Log in</button><button id="signup">Create account</button></div>
    <p id="err" class="err" role="alert"></p>
  </section>
  <section id="app" hidden>
    <header><h1>Your surveys</h1><button id="logout">Log out</button></header>
    <p id="empty" class="muted" hidden>No surveys yet. Upload one from your Cyclops and it will appear here.</p>
    <table id="list"></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let timer;

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { headers: { "content-type": "application/json" }, ...opts });
  return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
}
async function auth(kind) {
  const r = await api("/" + kind, { method: "POST", body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
  if (r.ok) { $("p").value = ""; $("err").textContent = ""; load(); } else $("err").textContent = r.data.error || "Something went wrong";
}
async function load() {
  clearTimeout(timer);
  const r = await api("/surveys");
  $("auth").hidden = r.ok; $("app").hidden = !r.ok;
  if (!r.ok) return;
  $("empty").hidden = r.data.length > 0;
  const t = $("list"); t.replaceChildren();
  for (const s of r.data) {
    const tr = t.insertRow();
    tr.insertCell().textContent = s.name;
    const st = tr.insertCell(); st.className = "muted";
    st.textContent = { uploading: "Uploaded", building: "Building…", ready: "Ready", failed: "Failed" }[s.status] + (s.error ? `: ${s.error}` : "");
    const act = tr.insertCell(); act.style.textAlign = "right";
    if (s.status === "ready") {
      const a = document.createElement("a"); a.href = "/viewer.html?id=" + encodeURIComponent(s.id); a.textContent = "View model"; act.append(a);
    } else if (s.status !== "building") {
      const b = document.createElement("button"); b.textContent = s.status === "failed" ? "Retry build" : "Build model";
      b.onclick = async () => { b.disabled = true; await api(`/surveys/${s.id}/build`, { method: "POST" }); load(); };
      act.append(b);
    }
  }
  if (r.data.some((s) => s.status === "building")) timer = setTimeout(load, 5000);
}
$("login").onclick = () => auth("login");
$("signup").onclick = () => auth("signup");
$("logout").onclick = async () => { await api("/logout", { method: "POST" }); load(); };
load();
</script>
</html>
